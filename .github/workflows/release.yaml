name: Release package

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2

      - name: Prepare release metadata
        id: release
        shell: Rscript {0}
        run: |
          description <- read.dcf("DESCRIPTION")[1L, ]
          package <- description[["Package"]]
          version <- description[["Version"]]
          news <- readLines("NEWS.md", warn = FALSE)
          heading <- sprintf("# %s %s", package, version)
          start <- match(heading, news)

          if (is.na(start)) {
            stop(sprintf("NEWS.md is missing the release heading: %s", heading))
          }

          entries <- news[seq_along(news) > start]
          next_heading <- grep("^# ", entries)
          if (length(next_heading)) {
            entries <- entries[seq_len(next_heading[[1L]] - 1L)]
          }
          notes <- trimws(paste(entries, collapse = "\n"))

          if (!nzchar(notes)) {
            stop(sprintf("NEWS.md has no entries under: %s", heading))
          }

          writeLines(notes, "release-notes.md")
          cat(sprintf("package=%s\nversion=%s\n", package, version),
              file = Sys.getenv("GITHUB_OUTPUT"), append = TRUE)

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE: ${{ steps.release.outputs.package }}
          VERSION: ${{ steps.release.outputs.version }}
        run: gh release create "v$VERSION" --target "$GITHUB_SHA" --title "$PACKAGE $VERSION" --notes-file release-notes.md